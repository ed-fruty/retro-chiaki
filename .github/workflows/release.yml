name: Build Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build against (e.g. v0.3.0). Does not push a tag or publish a release -- use this to validate the build/package steps only.'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Enable arm64 architecture
        run: sudo dpkg --add-architecture arm64

      - name: Install cross-compilation toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            git \
            zip \
            xkb-data \
            protobuf-compiler \
            libssl-dev:arm64 \
            libopus-dev:arm64 \
            libavcodec-dev:arm64 \
            libavformat-dev:arm64 \
            libavutil-dev:arm64 \
            libswscale-dev:arm64 \
            libswresample-dev:arm64 \
            libsdl2-dev:arm64 \
            libasound2-dev:arm64 \
            libpulse-dev:arm64 \
            libevdev-dev:arm64 \
            libudev-dev:arm64 \
            qtbase5-dev:arm64 \
            qttools5-dev:arm64 \
            libqt5svg5-dev:arm64 \
            qtmultimedia5-dev:arm64 \
            libqt5opengl5-dev:arm64 \
            qtbase5-dev \
            qttools5-dev \
            python3-pip
          pip3 install protobuf grpcio-tools

      - name: Build and package release
        run: |
          chmod +x packaging/build/ci-package.sh
          packaging/build/ci-package.sh "${{ inputs.version || github.ref_name }}"

      # The workflow_dispatch case has no tag to attach a release to, so
      # upload the zip as a normal build artifact instead -- otherwise a
      # manual test run's output would just be discarded with the runner.
      - name: Upload build artifact (workflow_dispatch test runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: retro-chiaki-${{ inputs.version }}
          path: dist/*.zip

      - name: Generate changelog
        id: git_cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Skipped for a manual workflow_dispatch test run: there's no pushed
      # tag to attach a release to in that case, and the build/package steps
      # above are already what such a run is meant to validate.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: Retro Chiaki ${{ github.ref_name }}
          body: ${{ steps.git_cliff.outputs.content }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
